name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      # Backgrounded with its output captured, so a CI-only failure is
      # diagnosable rather than a mystery.
      - name: Serve the built app
        run: |
          npx vite preview --port 5173 --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          npx --yes wait-on http://localhost:5173/ --timeout 60000

      # These need a real browser: a src-loaded sandbox="allow-scripts" iframe
      # is the thing under test.
      - name: Sandbox containment (isolated)
        run: npm run test:sandbox

      - name: Sandbox containment (reduced-isolation fallback)
        run: npm run test:fallback

      - name: End-to-end propose/approve/register loop
        run: npm run test:e2e

      # The same loop against Chrome's real WebMCP implementation. This is the
      # one that catches spec-vs-implementation gaps; the shim can only ever
      # prove we agree with ourselves.
      - name: End-to-end against native WebMCP
        run: npm run test:native

      - name: Overlap threshold calibration
        run: npm run calibrate

      - name: Server log
        if: failure()
        run: cat preview.log

      - name: Stop the server
        if: always()
        run: kill "$(cat preview.pid)" || true
